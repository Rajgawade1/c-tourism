<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-left">
            <a [routerLink]="['/home']" class="btn btn-primary">Back</a>
        </div>
        <h5 class="card-title">{{attractionDetails.title}}</h5>
        <div class="card-text">
            <span *ngFor="let point of attractionDetails.points">{{point}}</span>
        </div>
        <div class="d-flex mt-5 justify-content-center">
            <h5 class="card-title">Image Gallary</h5>
        </div>

        <div class="container mt-5">
            <div class="row">
                <div class="col" *ngFor="let image of attractionDetails.images">
                    <div class="card" style="width: 18rem;">
                        <picture>
                            <!-- Modern WebP source -->
                            <source
                                [srcset]="attractionDetails.srcWebp || ((attractionDetails.imagePath + image) | replaceExt:'.webp')"
                                type="image/webp">
                            <!-- Fallback image for older browsers -->
                            <img class="card-img-top" src]="attractionDetails.imagePath + image"
                                [alt]="attractionDetails.title" (click)="openFullscreen(content)" />
                        </picture>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <ng-template #content let-modal>
        <div class="modal-header">
            <span class="modal-title" id="modal-basic-title">{{attractionDetails.title}} Image Gallary</span>
            <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
        </div>


        <div class="modal-body">
            <ngb-carousel>
                <ng-template ngbSlide *ngFor="let image  of attractionDetails.images">
                    <div class="picsum-img-wrapper">

                          <picture>
                            <!-- Modern WebP source -->
                            <source
                                [srcset]="attractionDetails.srcWebp || ((attractionDetails.imagePath + image) | replaceExt:'.webp')"
                                type="image/webp">
                            <!-- Fallback image for older browsers -->
                            <img class="img-fluid-carousel" src]="attractionDetails.imagePath + image"
                                [alt]="attractionDetails.title" height="200"/>
                        </picture>

                
                    </div>
                </ng-template>
            </ngb-carousel>
        </div>
    </ng-template>

</div>
